services:
  - type: web
    name: career-compass
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: USE_LOCAL_MODEL
        value: "True"
      
    databases:
      - name: postgres
        version: 15
        
    autoDeploy: true
    branches:
      - main

databases:
  - name: postgres
    databaseName: career_compass_db
    user: career_compass_user
    version: 15
